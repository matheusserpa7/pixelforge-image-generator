# Production stack for a single VPS, served behind the VPS's shared edge proxy (docs/deployment.md):
#   - The edge proxy terminates HTTPS and forwards to `pixelforge-app:8080` over the external
#     `edge` Docker network, which must already exist. No host port is published: keep it that way,
#     the app trusts X-Forwarded-* from private networks (TRUSTED_PROXIES).
#   - Ship a version from your machine with `make deploy DEPLOY_HOST=user@host`.
#   docker compose -f compose.prod.yaml up -d --build --wait
# Same Dockerfile as development, `prod` target: no bind mounts, no Vite.
# All settings come from .env (APP_ENV=production, real secrets, never committed).
name: pixelforge-studio

x-logging: &logging
    driver: json-file
    options:
        max-size: '10m'
        max-file: '5'

x-app: &app
    image: '${APP_IMAGE:-pixelforge-studio:latest}'
    build:
        context: .
        target: prod
    env_file: .env
    restart: unless-stopped
    logging: *logging
    volumes:
        - storage:/app/storage/app
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy
    deploy:
        resources:
            limits:
                cpus: '1.0'
                memory: 512M

services:
    # The service name is its DNS name on every network it joins, including the shared `edge`
    # network, where other projects reach their own PHP as `app`: never name this service `app`.
    pixelforge-app:
        <<: *app
        environment:
            RUN_MIGRATIONS: 'true'
        networks:
            default: {}
            edge: {}

    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            pixelforge-app:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 30s
            timeout: 10s
            retries: 3
        stop_grace_period: 60s

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            pixelforge-app:
                condition: service_healthy
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

    mysql:
        image: mysql:8.4.13
        restart: unless-stopped
        logging: *logging
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:?DB_DATABASE is required}'
            MYSQL_USER: '${DB_USERNAME:?DB_USERNAME is required}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            timeout: 5s
            retries: 30
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G

    redis:
        image: redis:8.8-alpine
        restart: unless-stopped
        logging: *logging
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 10
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

volumes:
    mysql:
    redis:
    storage:

networks:
    edge:
        name: '${EDGE_NETWORK:-edge}'
        external: true
