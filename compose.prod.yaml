# Production stack for a single VPS:
#   docker compose -f compose.prod.yaml up -d --build
# Same Dockerfile as development, `prod` target: no bind mounts, no Vite.
# All settings come from .env (APP_ENV=production, real secrets, never committed).
name: pixelforge-studio

x-app: &app
    image: '${APP_IMAGE:-pixelforge-studio:latest}'
    build:
        context: .
        target: prod
    env_file: .env
    restart: unless-stopped
    volumes:
        - storage:/app/storage/app
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy
    deploy:
        resources:
            limits:
                cpus: '1.0'
                memory: 512M

services:
    app:
        <<: *app
        environment:
            RUN_MIGRATIONS: 'true'
        ports:
            - '${APP_PORT:-8080}:8080'

    horizon:
        <<: *app
        command: ['php', 'artisan', 'horizon']
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 30s
            timeout: 10s
            retries: 3
        stop_grace_period: 60s

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

    mysql:
        image: mysql:8.4.13
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:?DB_DATABASE is required}'
            MYSQL_USER: '${DB_USERNAME:?DB_USERNAME is required}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD is required}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            timeout: 5s
            retries: 30
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G

    redis:
        image: redis:8.8-alpine
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 10
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M

volumes:
    mysql:
    redis:
    storage:
