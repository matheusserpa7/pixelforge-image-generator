name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  PHP_EXTENSIONS: pdo_mysql, redis, intl, bcmath, zip, pcntl

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest, audit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: pixelforge
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: pixelforge
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Service containers take no server flags, so this mirrors `--log-bin-trust-function-creators=1`
      # from the compose files: without it the app user cannot create the append-only triggers.
      - name: Allow trigger creation
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Pest
        run: vendor/bin/pest

      - name: Composer audit
        run: composer audit

  frontend:
    name: Frontend (ESLint, Prettier, vue-tsc, build, audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wayfinder generates the typed route helpers with PHP, so the front end needs it too.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
          cp .env.example .env
          php artisan key:generate

      - name: Generate Wayfinder route helpers
        run: php artisan wayfinder:generate --with-form

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: vue-tsc
        run: npm run types:check

      - name: Build
        run: npm run build

      # picomatch has no patched release; the script still fails on every other high advisory.
      - name: npm audit
        run: node scripts/npm-audit.mjs

  docker:
    name: Production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the prod target
        run: docker build --target prod --tag pixelforge-studio:ci .
